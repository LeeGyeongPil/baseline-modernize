# Offline test run: no keys, no network after npm ci.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly check that dependencies and runtimes have not broken the build
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.19", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node dist/cli.js examples/legacy-app --exit-zero
